# .github/workflows/harvest.yml
# PUBLIC repo => unlimited Actions minutes.
# State lives in a SECRET GIST (never in this repo), so the phone list stays private.
#
#   fast pass : every 5 min  -> refund watch + commands + mask slice (near-continuous)
#   shard     : every 30 min -> 1/8 of the master, rotating (full sweep every 4h)
name: adil-harvest

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2,32 * * * *'
  workflow_dispatch:
    inputs:
      mode:  { description: 'fast | rescan', default: 'fast' }
      shard: { description: 'e.g. 0/8', default: '' }

concurrency:
  group: adil-${{ inputs.mode || (github.event.schedule == '*/5 * * * *' && 'fast' || 'shard') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fast:
    if: github.event.schedule == '*/5 * * * *' || inputs.mode == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q requests urllib3
      - name: fast pass
        env:
          ADIL_BOT_TOKEN: ${{ secrets.ADIL_BOT_TOKEN }}
          ADIL_CHAT_ID:   ${{ secrets.ADIL_CHAT_ID }}
          ADIL_GIST_ID:   ${{ secrets.ADIL_GIST_ID }}
          ADIL_GIST_TOKEN: ${{ secrets.ADIL_GIST_TOKEN }}
          ADIL_MODE: fast
          ADIL_BUDGET: '200'
        run: python -u adil_bot.py

  shard:
    if: github.event.schedule == '2,32 * * * *' || inputs.mode == 'rescan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q requests urllib3
      - name: rescan shard
        env:
          ADIL_BOT_TOKEN: ${{ secrets.ADIL_BOT_TOKEN }}
          ADIL_CHAT_ID:   ${{ secrets.ADIL_CHAT_ID }}
          ADIL_GIST_ID:   ${{ secrets.ADIL_GIST_ID }}
          ADIL_GIST_TOKEN: ${{ secrets.ADIL_GIST_TOKEN }}
          ADIL_MODE: rescan
          ADIL_BUDGET: '1500'
          ADIL_SHARD: ${{ inputs.shard }}
        run: |
          if [ -z "$ADIL_SHARD" ]; then
            N=$(( $(date -u +%H) * 2 + $(date -u +%M) / 30 ))   # 0..47
            ADIL_SHARD="$(( N % 8 ))/8"
          fi
          echo "shard=$ADIL_SHARD"
          python -u adil_bot.py
